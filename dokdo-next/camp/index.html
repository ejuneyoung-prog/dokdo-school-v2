:root{--ink:#232528;--panel:#2E3135;--lime:#B6D80C;--white:#FFFFFF;--mute:#A7ABB0;--ko:"Gmarket Sans","Apple SD Gothic Neo","Noto Sans KR",sans-serif;--num:"Bebas Neue",var(--ko);color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--white);font:500 15px/1.35 var(--ko);overflow:hidden;touch-action:none}
#stage{position:fixed;inset:0;display:block;width:100%;height:100%}
#tags{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;gap:4px;will-change:transform}
.bubble{max-width:220px;background:var(--white);color:var(--ink);padding:8px 12px;border-radius:14px;font-size:15px;text-align:center;word-break:keep-all;overflow-wrap:anywhere}
.name,.rock,.place{background:none;padding:0;font-size:17px;white-space:nowrap;color:var(--white);text-shadow:0 1px 3px rgba(0,0,0,.9),0 0 10px rgba(0,0,0,.65)}
.tag.me .name{color:var(--lime)}
#info{left:50%;transform:translateX(-50%);bottom:calc(var(--dk,64px) + 20px + env(safe-area-inset-bottom,0px));padding:7px 12px;width:min(380px,calc(100vw - 32px));box-sizing:border-box;display:grid;gap:1px;font-size:14px;background:rgba(46,49,53,.82)}
#info b{font-weight:500;color:var(--lime)}
.place b{font:400 18px var(--num);color:var(--lime);margin-left:6px;letter-spacing:.03em}
.card{position:fixed;background:rgba(46,49,53,.93);border-radius:14px}
/* 위쪽은 한 줄: 스쿨로 · 다음 목표 게이지 · 소리 크기. 시각·날씨·인원은 판 없이 글자만 그 아래에 둔다. */
#top{top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:min(680px,calc(100vw - 32px));box-sizing:border-box;padding:4px 6px;display:flex;align-items:center;gap:8px;background:rgba(46,49,53,.78)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#top .back{flex:none;padding:0 6px}
#top .vol{margin-left:auto;flex:none}
#snd{flex:none;padding-inline:10px}
#sub{position:fixed;top:calc(66px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:calc(100vw - 32px);display:flex;flex-wrap:wrap;justify-content:center;gap:2px 12px;font-size:14px;color:var(--white);text-shadow:0 1px 3px rgba(0,0,0,.9),0 0 8px rgba(0,0,0,.6);pointer-events:none;text-align:center}
#count{color:var(--white)}
#count b{font:400 19px var(--num);color:var(--lime);letter-spacing:.03em}
#nick{width:88px;flex:none;background:var(--ink);border:0;border-radius:10px;color:var(--lime);font:500 15px var(--ko);padding:9px 10px}
#dock{left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));padding:6px;display:grid;gap:6px;width:min(680px,calc(100vw - 32px));box-sizing:border-box;background:rgba(46,49,53,.82)}
#menu button{flex:1 1 auto;padding-inline:8px;white-space:nowrap}
#menu button[aria-expanded=true]{box-shadow:inset 0 -3px 0 var(--lime)}
#scenery{color:var(--mute)}
#unscene{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:rgba(35,37,40,.5);font-size:14px;min-height:44px;z-index:4}
body.scenery #top,body.scenery #sub,body.scenery #dock,body.scenery #info,body.scenery #hint,body.scenery #tags,body.scenery #toast{display:none!important}
.row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
button{font:500 14px var(--ko);color:var(--white);background:var(--ink);border:0;border-radius:10px;padding:9px 12px;cursor:pointer}
button:hover{background:#3a3e43}
button[aria-pressed=true],#send{background:var(--lime);color:var(--ink)}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
#say{display:flex;gap:6px}
#text{flex:1;min-width:0;background:var(--ink);border:0;border-radius:10px;color:var(--white);font:500 15px var(--ko);padding:9px 12px}
#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--dk,64px) + 20px + env(safe-area-inset-bottom,0px));background:rgba(35,37,40,.75);padding:6px 12px;border-radius:10px;font-size:14px;white-space:nowrap;pointer-events:none;transition:opacity .6s}
#enter{position:fixed;inset:0;display:grid;place-items:safe center;overflow-y:auto;padding-block:12px;box-sizing:border-box;background:rgba(35,37,40,.55);padding-inline:max(16px,env(safe-area-inset-left,0px));text-align:center;z-index:5}
#enter>div{background:var(--panel);border-radius:16px;padding:22px 26px;display:grid;gap:12px;max-width:340px}
#enter h2{margin:0;font-size:24px;font-weight:500}
#enter p{margin:0;color:var(--mute)}
#enter .note{font-size:14px}
#vr{color:var(--mute);font-size:14px}
#cmode{color:var(--lime);font-size:14px;font-weight:600}
.tabs{display:flex;gap:6px}
.tabs button{flex:1;min-width:0;padding-inline:6px}
.tabs button[aria-selected=true]{box-shadow:inset 0 -3px 0 var(--lime)}
#t-deck b,#deck h2 b{font:400 19px var(--num);color:var(--lime);letter-spacing:.03em}
#deck{left:50%;top:50%;transform:translate(-50%,-50%);width:min(440px,calc(100vw - 32px));max-height:calc(100dvh - 48px);box-sizing:border-box;padding:16px;display:grid;gap:12px;overflow-y:auto;touch-action:pan-y;z-index:4;background:var(--panel)}
.dhead{display:flex;justify-content:space-between;align-items:center}
#deck h2{margin:0;font-size:18px;font-weight:500}
#d-body{display:grid;gap:8px}
#d-body p{margin:0}
#d-body .mute{color:var(--mute);font-size:14px}
#d-body button.opt{text-align:left;padding:11px 12px;line-height:1.4}
#d-body button.opt:disabled{cursor:default;opacity:.62}
#d-body button.opt.right{background:var(--lime);color:var(--ink);opacity:1}
#d-body button.opt.wrong{background:#FF5A4E;color:var(--ink);opacity:1}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--ink);border-radius:10px;padding:10px 12px}
.item span{display:grid;gap:1px}
.item small{color:var(--mute);font-size:14px}
.item button{background:var(--panel);flex:none}
.item button:disabled{opacity:.55;cursor:default}
.item button[aria-pressed=true]{background:var(--lime);color:var(--ink)}
.item b{font-weight:500}
.rocks{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.rocks div{background:var(--ink);border-radius:10px;padding:8px 10px;font-size:14px}
.rocks div.no{color:var(--mute)}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));background:var(--lime);color:var(--ink);padding:8px 14px;border-radius:10px;z-index:6;white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}
#rest{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);display:grid;justify-items:center;gap:14px;text-align:center;z-index:3}
#r-dot{width:150px;height:150px;border-radius:50%;background:rgba(35,37,40,.42);box-shadow:inset 0 0 0 3px var(--white);display:grid;place-items:center;font-size:18px}
#r-left{font:400 28px var(--num);letter-spacing:.04em;background:rgba(35,37,40,.72);padding:2px 12px;border-radius:9px}
body.resting #dock,body.resting #sub,body.resting #top,body.resting #info,body.resting #hint,body.resting #tags{display:none}
#goal{flex:1 1 auto;min-width:0;display:grid;gap:4px;margin:0;padding:6px 10px;text-align:left;border-radius:9px}
#g-text{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
#g-bar{display:block;height:6px;background:#4a4e53;border-radius:3px;overflow:hidden}
#g-fill{display:block;height:100%;width:0;background:var(--lime);transition:width .4s}
.vol{width:88px;min-width:0;margin:0;accent-color:var(--lime);cursor:pointer}
#rest .vol{width:170px}
#goal,#snd,#nick,#text,#send{min-height:44px}
#start{background:var(--lime);color:var(--ink);font-size:16px;padding:12px}
#err{position:fixed;inset:0;display:grid;place-items:center;padding-inline:max(16px,env(safe-area-inset-left,0px));text-align:center}
@media (max-width:520px){#hint{display:none}#toast{top:auto;bottom:calc(var(--dk,64px) + 20px)}#top{gap:4px}#top .vol{width:64px}#top .back{padding:0 4px}#menu{gap:4px}#menu button{padding-inline:6px}}
.back{color:var(--lime);font-size:14px;line-height:1.6;text-decoration:none}
.back:hover{text-decoration:underline}
#enter .back{justify-self:center;padding:6px 8px}
#enter .note a{color:var(--mute)}
#err{z-index:9;background:var(--ink);align-content:center;gap:14px}
#dock{grid-template-columns:minmax(0,1fr)}
.login-cta{display:block;background:var(--lime);color:var(--ink);font-size:16px;padding:12px;border-radius:10px;text-decoration:none}
#enter.guest #start{background:none;color:var(--mute);font-size:14px;text-decoration:underline;padding:6px}
.back{display:inline-flex;align-items:center;min-height:44px}
.row button,.tabs button{min-height:44px}
body{word-break:keep-all;overflow-wrap:break-word}
body:has(#deck:not([hidden])) #hint{display:none!important}
body:has(#deck:not([hidden])) #toast{top:calc(14px + env(safe-area-inset-top,0px));bottom:auto}
@media (max-width:520px){.row{flex-wrap:wrap;overflow-x:visible;justify-content:center;touch-action:auto}.row button{flex:1 1 40%;min-width:0;padding-inline:8px}#hint{display:block;white-space:normal;width:calc(100vw - 48px);max-width:340px;text-align:center}#snd,#nick,#enter button{min-height:44px}.vol{height:32px}}
</style>

<div id="tags"></div>
<div id="top" class="card"><a class="back" href="../?area=learn" aria-label="스쿨로 돌아가기">← 스쿨</a><h1 class="sr">독도에서 힐링하기</h1><button id="goal" hidden><span id="g-text"></span><span id="g-bar"><span id="g-fill"></span></span></button><input class="vol" type="range" min="0" max="100" aria-label="소리 크기"><button id="snd" aria-pressed="true">소리</button></div>
<div id="sub"><span id="now"></span><span id="count">바다로 나가는 중</span><span id="vr" hidden>화면 속 가상 체험입니다</span><span id="cmode" hidden>크리에이터 모드 · 기록 저장 안 함</span></div>
<div id="hint" hidden>바다를 누르면 이동, 끌면 둘러보기, 휠이나 두 손가락으로 가까이 보기</div>

<div id="enter"><div><h2>독도에서 힐링하기</h2><p>파도 소리를 들으며 쉬어 가는 곳입니다. 대황을 모으면 동도와 서도에 오를 수 있습니다.</p><a id="login-cta" class="login-cta" href="../account.html?next=camp%2F" hidden>로그인하고 들어가기</a><button id="start">바다에서 독도 보기</button><button id="e-camp">동도 정상 캠핑</button><button id="e-stay">서도 주민숙소</button><p class="note">화면 속 가상 체험입니다. 실제 독도는 천연보호구역이라 머물 수 있는 곳과 시간이 제한됩니다.</p><p class="note">날씨 자료 <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a></p><a class="back" href="../?area=learn">← 스쿨로 돌아가기</a></div></div>
<div id="info" class="card" hidden><b></b><span></span></div>
<div id="dock" class="card">
 <div class="row" id="p-rest" hidden><button id="v-sea" aria-pressed="false">바다에서 보기</button><button id="v-camp" aria-pressed="false">동도 정상 캠핑</button><button id="v-stay" aria-pressed="false">서도 주민숙소</button><button id="breath">3분 쉬기</button><button id="creator" hidden aria-pressed="false">크리에이터 모드</button></div>
 <div class="row" id="p-sail" hidden><button id="go-seo">서도로 가기</button><button id="go-dong">동도로 가기</button><button id="auto" aria-pressed="false">자동 항해</button><button id="look">360도 둘러보기</button><button id="bow" aria-pressed="false">뱃머리 시점</button></div>
 <div class="row" id="p-talk" hidden><button id="wave">손 흔들기</button><button class="q">풍경이 참 좋아요</button><button class="q">같이 쉬어요</button><button class="q">또 만나요</button></div>
 <form id="say" hidden><input id="nick" maxlength="8" autocomplete="off" aria-label="내 이름" title="내 이름" placeholder="내 이름"><input id="text" maxlength="30" placeholder="말풍선으로 인사하기" autocomplete="off" aria-label="말풍선 내용"><button id="send" type="submit">보내기</button></form>
 <div class="tabs" id="menu" aria-label="메뉴"><button id="t-rest" aria-expanded="false" aria-controls="p-rest">쉼터</button><button id="t-sail" aria-expanded="false" aria-controls="p-sail">항해</button><button id="t-talk" aria-expanded="false" aria-controls="p-talk">인사</button><button id="t-deck">대황 <b id="shell">0</b></button><button id="scenery">풍경만 보기</button></div>
</div>
<button id="unscene" hidden>메뉴 보기</button>
<div id="deck" class="card" role="dialog" aria-label="대황과 꾸미기" hidden><div class="dhead"><h2>대황 <b id="shell2">0</b></h2><button id="d-close">닫기</button></div><div class="tabs"><button data-d="q" aria-selected="true">오늘의 퀴즈</button><button data-d="i" aria-selected="false">꾸미기</button><button data-d="r" aria-selected="false">바위 도감</button></div><div id="d-body"></div></div>
