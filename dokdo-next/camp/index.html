function phase(time){const jd=time.getTime()/86400000+2440587.5,d=jd-2451545,r=Math.PI/180;

function animateCloth(){

 const defs=document.createElementNS(ns,'defs');defs.append(sheet);flag.append(defs);
 const width=51,count=20,step=width/count,parts=[];
 for(let i=0;i<count;i++){
   const strip=document.createElementNS(ns,'svg');
   strip.setAttribute('x',i*step);strip.setAttribute('width',step+.04);strip.setAttribute('height',34);

   }

 }

}
