<title>독도 240문항 · 전수 수정 검토</title><link rel="stylesheet" href="./assets/app.css"><style>
body{padding:28px 20px;color:#e4edf0;background:#071a27;font-size:17px}.review-shell{max-width:1040px;margin:auto}.review-header{border-bottom:1px solid #365567;padding:12px 0 24px;margin-bottom:24px}.review-header h1{font-size:clamp(24px,4vw,36px);margin:12px 0}.review-note{font-size:14px;line-height:1.65;color:#b0ccd6}.review-controls{display:grid;grid-template-columns:1.6fr 1fr .7fr;gap:15px;margin:26px 0 20px}.review-controls label{font-size:14px}.review-controls select,.review-controls input{width:100%;margin-top:7px;background:#153445;color:#e4edf0;border:1px solid #4c778a;padding:12px;border-radius:9px;font-size:16px}.review-controls input{grid-column:1/-1}.review-nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:20px 0}.review-nav button{padding:10px 20px;min-height:44px}.review-status{color:#aecdd7;font-size:14px;line-height:1.6}.review-card{padding:26px;border:1px solid #305669;border-radius:16px;background:#0b2433}.review-card h2{font-size:clamp(22px,3vw,32px);line-height:1.55;margin:22px 0}.review-question-context{white-space:pre-wrap;border-left:3px solid #517b8b;color:#cadbe0;padding:10px 16px;font-size:16px;line-height:1.7}.review-material{background:#173b4d;border-left:3px solid #75b0b8;border-radius:10px;padding:18px;margin:20px 0;white-space:pre-wrap;line-height:1.8}.review-options{display:grid;gap:12px}.review-options button{padding:18px;text-align:left;display:flex;align-items:start;gap:14px;min-height:58px;border:1px solid #456675;border-radius:12px;background:#132e3e;color:#e8f0f1;font-size:20px;line-height:1.5}.review-options button:hover{border-color:#f1c567}.review-options .correct{border:2px solid #79bca0}.review-options .incorrect{border:2px solid #dd8d81}.review-answer{border-left:3px solid #f1c567;background:#203a46;padding:20px;margin-top:22px;border-radius:10px;line-height:1.8}.review-feedback{border-top:1px solid #44616d;margin-top:12px;padding-top:12px;font-size:16px}.review-footer{font-size:13px;color:#aac9d3;line-height:1.75;margin-top:23px;overflow-wrap:anywhere}.review-footer a{display:inline-block;color:#b4dae1;margin:6px 15px 6px 0}.review-card button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #f1c567;outline-offset:3px}.review-answer[hidden],.review-material[hidden],.review-question-context[hidden]{display:none}#empty{padding:40px 0}.review-actions{margin-top:20px;display:flex;gap:16px;flex-wrap:wrap}.review-actions button{min-height:44px;padding:12px 20px;border:1px solid #829aaa;border-radius:10px;background:#0c283a;color:#e6eef1;font-size:16px}@media(max-width:600px){body{padding:14px 12px}.review-card{padding:18px}.review-controls{grid-template-columns:1fr 1fr}.review-controls label:first-child{grid-column:1/-1}.review-options button{font-size:18px}}
