name: Dokdo next verification
on:
  push:
    paths: ["dokdo-next/**", ".github/workflows/dokdo-next-verify.yml"]
  pull_request:
    paths: ["dokdo-next/**", ".github/workflows/dokdo-next-verify.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  logic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: dokdo-next
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: |
          mkdir -p test-results
          python tools/content/build_course.py --check
          python -m unittest tests.test_content_gate -v
          npm test > test-results/model.tap
          node tests/migration.cjs test-results/migration.json
          python tools/check_site.py test-results/static.json
          python tests/test_homepage_switch.py
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: dokdo-logic-evidence
          path: dokdo-next/test-results/
  native-browser:
    needs: logic
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    defaults:
      run:
        working-directory: dokdo-next
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-test.txt
      - run: python -m playwright install --with-deps ${{ matrix.engine }}
      - run: python tests/release-13-browser.py --mode http --engine ${{ matrix.engine }} --output test-results/integration-${{ matrix.engine }}
      - run: python tests/browser.py --mode http --engine ${{ matrix.engine }} --output test-results/${{ matrix.engine }}
      - run: python tests/clear-browser.py --phase flow --mode http --engine ${{ matrix.engine }} --output test-results/flow-${{ matrix.engine }}
      - run: python tests/clear-browser.py --phase matrix --mode http --engine ${{ matrix.engine }} --output test-results/matrix-${{ matrix.engine }}
      - run: python tests/clear-browser.py --phase screens --mode http --engine ${{ matrix.engine }} --output test-results/screens-${{ matrix.engine }}
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: dokdo-${{ matrix.engine }}-evidence
          path: dokdo-next/test-results/
